name: 📦 Build & Publish images

# ⚠️ Ce workflow NE DÉPLOIE PAS. Il builde et pousse des images sur ghcr, que
# `deploy.sh` tire ensuite sur le VPS (#425).
#
# Il s'appelait « 🚀 Deploy », ce qui a laissé croire pendant des semaines que la
# production suivait `main`. Elle avait en réalité 15 commits de retard, dont un
# correctif de sécurité, sans que rien ne le signale (#341). Le déploiement réel
# se lance à la main : `ssh` puis `./deploy.sh` à la racine du dépôt sur le VPS.
#
# Chaque image porte deux étiquettes : `sha-<commit court>`, immuable, et
# `latest`, mouvante. `deploy.sh` tire par SHA — `latest` ne sert qu'au dépannage
# manuel. Sans étiquette immuable, un `docker pull` ne dit pas ce qu'il ramène et
# un retour arrière n'a rien à désigner.
#
# Pour vérifier ce qui tourne réellement en production :
#   curl -s https://api.arbore.app/health | jq -r .commit

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      # Une image cassée ne doit pas empêcher les autres d'être publiées : le
      # VPS peut alors tirer ce qui existe et ne rebâtir localement que le reste.
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./ArboreBackend
            suffix: backend
          - service: ai-generator
            context: ./AiGenerator
            suffix: ai
          - service: web
            context: ./web
            suffix: web

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr refuse les majuscules dans un nom de dépôt, or le nôtre en contient
      # (ArboreTeam/Arbore).
      - name: Compute image name
        id: image
        run: |
          repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=${{ env.REGISTRY }}/${repo_lower}-${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"

      - name: Build & Push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          # Remonté par GET /health (#341). Seul le backend le lit, mais le
          # passer partout évite d'avoir à se souvenir lequel le consomme.
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.service }}"
            echo ""
            echo '```'
            echo "${{ steps.image.outputs.name }}:sha-${{ github.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
