name: 📦 Build & Publish images

# ⚠️ Ce workflow NE DÉPLOIE PAS. Il builde et pousse des images sur ghcr, que
# `deploy.sh` tire ensuite sur le VPS (#425).
#
# Il s'appelait « 🚀 Deploy », ce qui a laissé croire pendant des semaines que la
# production suivait `main`. Elle avait en réalité 15 commits de retard, dont un
# correctif de sécurité, sans que rien ne le signale (#341). Le déploiement réel
# se lance à la main : `ssh` puis `./deploy.sh` à la racine du dépôt sur le VPS.
#
# Ce workflow est né de la fusion de deux publieurs concurrents qui produisaient
# les mêmes images sous deux nommages, doublant le temps de CI et un tiers des
# versions du registre (#429). L'ancien `docker-publish.yml` a été retiré ; ses
# deux apports — build sur PR sans publication, et `metadata-action` — sont
# repris ici.
#
# Pour vérifier ce qui tourne réellement en production :
#   curl -s https://api.arbore.app/health | jq -r .commit

on:
  push:
    # `dev` publie aussi (#434) : sans ça, chaque déploiement de l'environnement
    # de dev rebâtissait sur le VPS, ce qui annulait le bénéfice de #425.
    #
    # Le coût est borné par la rétention (#442) : dix versions `sha-` par
    # package, les releases `v*` et les étiquettes mouvantes exclues. Sans cette
    # borne posée d'abord, on aurait ajouté un robinet à une baignoire sans
    # bonde.
    #
    # `latest` reste attaché à la branche par défaut via `is_default_branch` :
    # une publication depuis `dev` ne la déplace pas.
    branches: [ "main", "dev" ]
    tags: [ "v*" ]
  # Les PR sont BUILDÉES sans être publiées : une image cassée est détectée
  # avant le merge, pas après. C'est l'apport principal de l'ancien workflow, et
  # ça ne coûte rien au registre puisque rien n'est poussé.
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Barrière avant publication.
  #
  # `ci.yml` ne tourne PAS sur un push vers `dev` — par économie : l'événement
  # `pull_request` a déjà testé le commit de merge. Mais ce workflow-ci, lui,
  # publie sur `dev`. Une image partait donc vers ghcr, et de là vers le VPS au
  # prochain `deploy.sh`, sans qu'aucun test n'ait été exécuté sur ce chemin.
  #
  # Le gain de #425 était de ne plus bâtir sur le VPS. Il ne doit pas se payer
  # par la publication d'un arbre rouge.
  #
  # Pourquoi la suite web et pas celle du backend : elle coûte deux secondes,
  # là où les tests Go en coûtent cinq minutes à chaque publication. Le backend
  # reste couvert par `ci.yml`, qui tourne sur toutes les PR. Si cette barrière
  # échoue, AUCUNE image n'est publiée — y compris celle du backend : un arbre
  # rouge ne se déploie pas à moitié.
  # ───────────────────────────────────────────────────────────────────────────
  verifier:
    name: 🧪 Tests avant publication
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Alignée sur web/Dockerfile (node:24-alpine) : tester sur une autre
          # version que celle de l'image publiée, c'est tester autre chose.
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

  build:
    needs: verifier
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      # Une image cassée ne doit pas empêcher les autres d'être publiées : le
      # VPS peut alors tirer ce qui existe et ne rebâtir localement que le reste.
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./ArboreBackend
            suffix: backend
          - service: web
            context: ./web
            suffix: web

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Container Registry
        # Inutile sur une PR : rien n'y est poussé.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr refuse les majuscules dans un nom de dépôt, or le nôtre en contient
      # (ArboreTeam/Arbore).
      - name: Compute image name
        id: image
        run: |
          repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=${{ env.REGISTRY }}/${repo_lower}-${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"

      # Deux réglages non évidents dans la liste ci-dessous :
      #
      #   `type=sha,format=long` — SHA COMPLET, pas le format court par défaut.
      #   `deploy.sh` tire `sha-$(git rev-parse HEAD)` ; un SHA court ne
      #   correspondrait à rien et le déploiement retomberait silencieusement
      #   sur un build local.
      #
      #   `enable={{is_default_branch}}` sur `latest` — sans cette garde, une
      #   publication depuis une autre branche déplacerait l'étiquette, et le
      #   repli manuel `docker pull …:latest` servirait autre chose que la
      #   production.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build & Push ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Remonté par GET /health (#341). Seul le backend le lit, mais le
          # passer partout évite d'avoir à se souvenir lequel le consomme.
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### ${{ matrix.service }}"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
