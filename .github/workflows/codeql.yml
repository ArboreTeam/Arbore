name: "🔒 CodeQL Security Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 2 * * 1'  # Tous les lundis à 2h30

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'macos-14' || 'ubuntu-latest' }}
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: python
            build-mode: none
          - language: swift
            build-mode: manual

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-extended,security-and-quality

    - name: Build Swift (manual)
      if: matrix.language == 'swift'
      working-directory: ./ArboreUi
      run: |
        # Setup pour Swift
        if [ -f Podfile ]; then
          pod install --repo-update || echo "CocoaPods installation failed"
        fi
        
        # Build Swift
        if [ -f ArboreUi.xcworkspace ]; then
          xcodebuild clean build \
            -workspace ArboreUi.xcworkspace \
            -scheme ArboreUi \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" || echo "Build completed with warnings"
        fi

    - name: Autobuild
      if: matrix.build-mode == 'autobuild'
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
