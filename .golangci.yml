# Configuration pour golangci-lint
# https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - unconvert
    - unparam
    - gocyclo
    - gosec
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false

    gocyclo:
      min-complexity: 20

    revive:
      confidence: 0.8

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  
output:
  formats:
    text:
      print-issued-lines: true
      print-linter-name: true
      colors: true
