name: 🏗️ Terraform

# Valide la déclaration d'infrastructure à chaque PR qui y touche.
#
# Ne fait PAS d'`apply`, et ne fait pas encore de `plan` : le plan exige un
# jeton Cloudflare, absent des secrets tant que l'étape manuelle n'est pas
# faite (#401). En attendant, `validate` attrape déjà ce qui casse le plus
# souvent — syntaxe, attributs inconnus, références mortes.
#
# Une fois CLOUDFLARE_API_TOKEN en place, ajouter ici un job `plan` qui commente
# la PR, puis un job `apply` déclenché au merge. Jamais d'apply depuis un poste.

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v3
        with:
          # Doit satisfaire le `required_version` de versions.tf. `use_lockfile`
          # sur le backend S3 exige >= 1.10.
          terraform_version: "1.10.5"

      - name: Format
        run: terraform fmt -check -recursive -diff

      # -backend=false : la validation ne doit pas exiger d'accès au state, donc
      # pas de credentials. C'est ce qui permet de faire tourner ce job sur les
      # PR de forks et sans secret.
      - name: Init
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate -no-color
