# Configuration pour golangci-lint
# https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - unconvert
    - unparam
    - gocritic
    - gocyclo
    - dupl
    - gosec
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    govet:
      enable:
        - shadow

    gocyclo:
      min-complexity: 15

    dupl:
      threshold: 100

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance

    revive:
      confidence: 0.8

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  
output:
  formats:
    text:
      print-issued-lines: true
      print-linter-name: true
      colors: true
