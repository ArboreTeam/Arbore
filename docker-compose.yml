services:
  # ─────────────────────────────────────────────
  # 🤖  AI Generator  (FastAPI / Python)
  # ─────────────────────────────────────────────
  ai-generator:
    build:
      context: ./AiGenerator
      dockerfile: Dockerfile
    container_name: arbore-ai-generator
    restart: unless-stopped
    # Rotation des journaux (#385). Sans elle, le driver json-file croît sans
    # limite : les journaux d'accès contiennent des adresses IP (tronquées
    # depuis #385, mais des données personnelles tout de même) et seraient
    # conservés indéfiniment, faute de politique de conservation — contraire au
    # principe de limitation de la conservation (RGPD art. 5(1)(e)).
    # 3 fichiers de 10 Mo = fenêtre glissante bornée, les plus anciens écrasés.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    init: true
    read_only: true
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    environment:
      - AI_PROVIDER=${AI_PROVIDER:-mistral}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MISTRAL_MODEL=${MISTRAL_MODEL:-mistral-small-latest}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - arbore-net

  # ─────────────────────────────────────────────
  # 🌿  Backend  (Gin / Go)
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./ArboreBackend
      dockerfile: Dockerfile
      args:
        # Commit déployé, remonté par GET /health (cf. #341). deploy.sh
        # l'exporte ; un build manuel sans cette variable donne "unknown".
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: arbore-backend
    restart: unless-stopped
    # Rotation des journaux (#385). Sans elle, le driver json-file croît sans
    # limite : les journaux d'accès contiennent des adresses IP (tronquées
    # depuis #385, mais des données personnelles tout de même) et seraient
    # conservés indéfiniment, faute de politique de conservation — contraire au
    # principe de limitation de la conservation (RGPD art. 5(1)(e)).
    # 3 fichiers de 10 Mo = fenêtre glissante bornée, les plus anciens écrasés.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    init: true
    read_only: true
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_URI_TEST=${MONGODB_URI_TEST:-}
      - ARBORE_API_KEY=${ARBORE_API_KEY}
      - ARBORE_API_KEY_TEST=${ARBORE_API_KEY_TEST:-}
      - FIREBASE_SERVICE_ACCOUNT_PATH=/run/secrets/firebase-adminsdk.json
      # Clé maître : le FICHIER est préféré (cf. le montage plus bas). Tant que
      # MASTER_ENCRYPTION_KEY_PATH est vide, c'est la variable qui sert — ce qui
      # rend la bascule progressive et réversible.
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY:-}
      - MASTER_ENCRYPTION_KEY_PATH=${MASTER_ENCRYPTION_KEY_PATH:-}
      # Origines navigateur autorisées. Vide = CORS désactivé (audit #338
      # constat 5) : le web passe par son proxy Next.js côté serveur.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - APPLE_TEAM_ID=${APPLE_TEAM_ID:-}
      # Stockage des assets 3D (#401 étape 5). `docker compose` ne transmet au
      # conteneur QUE les variables listées ici : le `.env` sert à la
      # substitution ${VAR} dans ce fichier, pas à peupler l'environnement du
      # conteneur. Sans ces lignes, le backend retombe silencieusement sur
      # `filesystem` — ce qui masque l'absence de configuration au lieu de la
      # signaler.
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-}
      - STORAGE_S3_ENDPOINT=${STORAGE_S3_ENDPOINT:-}
      - STORAGE_S3_BUCKET=${STORAGE_S3_BUCKET:-}
      - STORAGE_S3_REGION=${STORAGE_S3_REGION:-}
      - STORAGE_S3_ACCESS_KEY=${STORAGE_S3_ACCESS_KEY:-}
      - STORAGE_S3_SECRET_KEY=${STORAGE_S3_SECRET_KEY:-}
      - STORAGE_S3_USE_SSL=${STORAGE_S3_USE_SSL:-}
      - STORAGE_MAX_OPS_PER_MINUTE=${STORAGE_MAX_OPS_PER_MINUTE:-}
      - STORAGE_MAX_OBJECT_BYTES=${STORAGE_MAX_OBJECT_BYTES:-}
      - APPLE_KEY_ID=${APPLE_KEY_ID:-}
      - APPLE_SIWA_CLIENT_ID=${APPLE_SIWA_CLIENT_ID:-}
      - APPLE_SIWA_KEY_PATH=/run/secrets/apple-siwa.p8
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - UNSPLASH_ACCESS_KEY=${UNSPLASH_ACCESS_KEY}
      - GIN_MODE=${GIN_MODE:-release}
      # Le port interne reste fixe ; PORT ne change que le port publié sur l'hôte.
      - PORT=8080
      # Le backend appelle l'AI Generator via le réseau Docker interne
      - AI_GENERATOR_URL=http://ai-generator:8000
      - ARBORE_ADMIN_UIDS=${ARBORE_ADMIN_UIDS:-}
      # Thumbnails dans un chemin séparé (hors du montage read-only /app/models)
      - THUMBNAILS_DIR=/app/thumbnails
      # Montage conservé uniquement pour supprimer les anciens fichiers lors
      # d'une suppression de compte. Aucune route communautaire n'est exposée.
      - COMMUNITY_UPLOADS_DIR=/app/uploads/community
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    volumes:
      # Fichiers 3D USDZ (lecture seule)
      - ${MODELS_HOST_PATH:-./ArboreBackend/models}:/app/models:ro
      # Thumbnails : bind mount sur le dossier existant de la VM (conserve les anciens thumbnails)
      - ${THUMBNAILS_HOST_PATH:-./ArboreBackend/models/thumbnails}:/app/thumbnails
      # Firebase service account JSON (le vrai fichier du projet)
      - ${FIREBASE_SERVICE_ACCOUNT_HOST_PATH:-./arbore-firebase-adminsdk.json}:/run/secrets/firebase-adminsdk.json:ro
      # Clé privée Apple : fichier hôte hors Git, lecture seule dans le conteneur.
      - ${APPLE_SIWA_KEY_HOST_PATH:-./AuthKey_A4X35PAX94.p8}:/run/secrets/apple-siwa.p8:ro
      # Clé maître AES : préférable à une variable d'environnement, lisible par
      # `docker inspect` (audit #338 constat 4). Défaut /dev/null — toujours
      # présent, donc aucun répertoire fantôme n'est créé quand le fichier n'est
      # pas fourni ; le backend ne le lit que si MASTER_ENCRYPTION_KEY_PATH est
      # défini, sinon il retombe sur la variable d'environnement.
      - ${MASTER_ENCRYPTION_KEY_HOST_PATH:-/dev/null}:/run/secrets/master-encryption.key:ro
      # Anciennes images communautaires, accessibles uniquement pour effacement RGPD.
      - ${LEGACY_COMMUNITY_UPLOADS_HOST_PATH:-./ArboreBackend/uploads/community}:/app/uploads/community
    depends_on:
      ai-generator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - arbore-net

  # ─────────────────────────────────────────────
  # 🌱  Web  (Next.js)
  # ─────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: arbore-web
    restart: unless-stopped
    # Rotation des journaux (#385). Sans elle, le driver json-file croît sans
    # limite : les journaux d'accès contiennent des adresses IP (tronquées
    # depuis #385, mais des données personnelles tout de même) et seraient
    # conservés indéfiniment, faute de politique de conservation — contraire au
    # principe de limitation de la conservation (RGPD art. 5(1)(e)).
    # 3 fichiers de 10 Mo = fenêtre glissante bornée, les plus anciens écrasés.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    init: true
    read_only: true
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /app/.next/cache:size=128m,nosuid,nodev
    environment:
      - NODE_ENV=production
      # Le proxy /api/backend (server-side) appelle le backend via le réseau Docker.
      - BACKEND_API_URL=http://backend:8080
      # Clé API injectée côté serveur par le proxy (jamais exposée au navigateur).
      - ARBORE_API_KEY=${ARBORE_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN:-}
      - NEXT_PUBLIC_SENTRY_ENV=${NEXT_PUBLIC_SENTRY_ENV:-production}
      - NEXT_PUBLIC_APP_VERSION=${NEXT_PUBLIC_APP_VERSION:-1.0.0}
      - PORT=3000
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 (et pas localhost) : dans le conteneur, localhost résout
      # d'abord en IPv6 [::1] où Next.js n'écoute pas (bind 0.0.0.0 IPv4) →
      # faux "unhealthy". Forcer l'IPv4 rend le check fiable.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - arbore-net



  # ─────────────────────────────────────────────
  # 🪣  MinIO — simulateur S3 local, DÉVELOPPEMENT UNIQUEMENT
  # ─────────────────────────────────────────────
  #
  # Sous le profil `dev` : ce service ne démarre JAMAIS en production, où
  # `docker compose up` est lancé sans profil. La production utilise
  # Cloudflare R2 (#401 étape 5).
  #
  #   docker compose --profile dev up -d minio
  #
  # Le même `StorageProvider` sert les deux : MinIO et R2 parlent le protocole
  # S3. Seules deux valeurs changent — l'endpoint et `USE_SSL=false`.
  #
  # Les identifiants ci-dessous sont des valeurs de développement, volontairement
  # en clair : elles ne donnent accès qu'à un conteneur local sans données
  # réelles. Les surcharger via l'environnement si besoin.
  minio:
    image: minio/minio:latest
    container_name: arbore-minio
    profiles: ["dev"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-arbore-dev}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-arbore-dev-secret}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # console web
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - arbore-net

# ─────────────────────────────────────────────
# 🔌  Réseau interne
# ─────────────────────────────────────────────
networks:
  arbore-net:
    driver: bridge

# ─────────────────────────────────────────────
# 💾  Volumes
# ─────────────────────────────────────────────
volumes:
  # Données MinIO du poste de développement. Jamais créé en production : le
  # service qui l'utilise est sous le profil `dev`.
  minio-data:
