name: 🌱 Arbore CI/CD

# Déclenche le workflow sur push ou PR vers main/develop
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      clean_pods_cache:
        description: 'Clean CocoaPods cache before build'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Permissions pour les actions GitHub
permissions:
  contents: read
  pull-requests: write
  checks: write
  statuses: write

# Annule les workflows en cours si un nouveau push est fait
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.22"
  PYTHON_VERSION: "3.11"
  XCODE_VERSION: "16.2"

jobs:
  # Détection des changements pour optimiser les builds
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ai_generator: ${{ steps.filter.outputs.ai_generator }}
      ios_ui: ${{ steps.filter.outputs.ios_ui }}
      ios_ar: ${{ steps.filter.outputs.ios_ar }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            backend:
              - 'ArboreBackend/**'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
            ai_generator:
              - 'AiGenerator/**'
              - '.github/workflows/ci.yml'
            ios_ui:
              - 'ArboreUi/**'
              - '.github/workflows/ci.yml'
            ios_ar:
              - 'ArboreARkit/**'
              - '.github/workflows/ci.yml'

  # Backend Go - Tests et Build
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ArboreBackend
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🔧 Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ArboreBackend/go.sum

      - name: 📦 Download dependencies
        run: |
          go mod download
          go mod verify

      - name: 🔍 Vet code
        run: go vet ./...

      - name: 🧪 Run tests with coverage
        run: |
          echo "🧪 Running all backend tests (including /models endpoint)..."
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

          echo ""
          echo "📊 Coverage summary:"
          go tool cover -func=coverage.out | grep "total:" || go tool cover -func=coverage.out

          echo ""
          echo "✅ All backend tests passed (including model streaming tests)"

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          file: ./ArboreBackend/coverage.out
          flags: backend
          name: backend-coverage

      - name: 🔍 Lint code with golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: ArboreBackend
          version: v2.11.3
          args: --timeout=5m

      - name: 🏗️ Build binary (Linux)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o main-linux-amd64 .
          
      - name: 🏗️ Build binary (macOS)
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-w -s" -o main-darwin-arm64 .

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-binaries
          path: |
            ArboreBackend/main-linux-amd64
            ArboreBackend/main-darwin-arm64
          retention-days: 7

  # AI Generator Python - Tests et Build  
  ai_generator:
    needs: changes
    if: needs.changes.outputs.ai_generator == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./AiGenerator
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: AiGenerator/requirements.txt

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then 
            pip install -r requirements.txt
          fi
          pip install pytest pytest-cov black flake8 mypy pylint

      - name: 🎨 Check code formatting with Black
        run: |
          black --check --diff . || {
            echo "❌ Code formatting issues found. Run 'black .' to fix."
            exit 1
          }

      - name: 🔍 Lint with Flake8
        run: |
          flake8 . \
            --count \
            --max-line-length=88 \
            --extend-ignore=E203,W503,E501 \
            --statistics \
            --show-source

      - name: 🔍 Type check with mypy
        continue-on-error: true
        run: |
          mypy . --ignore-missing-imports || echo "Type checking completed with warnings"

      - name: 🧪 Run tests with coverage
        run: |
          if [ -d tests ]; then
            pytest -v --cov=. --cov-report=xml --cov-report=term
          else
            echo "⚠️ No tests directory found"
            mkdir -p tests
            echo "# TODO: Add tests" > tests/__init__.py
          fi

      - name: 📊 Upload coverage
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          file: ./AiGenerator/coverage.xml
          flags: ai-generator
          name: ai-generator-coverage

      - name: 🐳 Build Docker image
        run: |
          docker build -t arbore-ai-generator:${{ github.sha }} .
          docker tag arbore-ai-generator:${{ github.sha }} arbore-ai-generator:latest
          
      - name: 🔍 Scan Docker image for vulnerabilities
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            arbore-ai-generator:latest || echo "Vulnerability scan completed"

  # iOS UI - Build (nécessite macOS)
  ios_ui:
    needs: changes
    if: needs.changes.outputs.ios_ui == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ./ArboreUi
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🔧 Setup Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: 📱 Show Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: 💎 Setup Ruby for CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: 📦 Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: |
            ArboreUi/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('ArboreUi/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: 🔧 Install CocoaPods, xcpretty and xcresultparser
        run: |
          sudo gem install cocoapods -v 1.16.2
          sudo gem install xcpretty
          brew install a7ex/formulae/xcresultparser
          pod --version
          xcpretty --version
          xcresultparser --version

      - name: 🗑️ Clean CocoaPods cache (si demandé manuellement)
        if: github.event.inputs.clean_pods_cache == 'true'
        run: |
          echo "🧹 Nettoyage du cache CocoaPods demandé..."
          pod cache clean --all
          rm -rf ~/Library/Caches/CocoaPods
          rm -rf ~/.cocoapods

      - name: 🔐 Setup Firebase Configuration
        run: |
          echo "📝 Creating GoogleService-Info.plist from secret..."
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 --decode > GoogleService-Info.plist
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 --decode > ArboreUi/GoogleService-Info.plist
          echo "✅ GoogleService-Info.plist created"

      - name: 🔑 Setup Secrets Configuration
        run: |
          echo "📝 Creating Secrets.xcconfig..."
          cat > Secrets.xcconfig << EOF
          // Secrets.xcconfig - Generated by CI
          // ⚠️ This file is auto-generated in CI

          // === SECURITY ===
          // API Key for authenticating iOS app with backend
          ARBORE_API_KEY = ${{ secrets.ARBORE_API_KEY }}

          // === BACKEND ===
          // Backend protocol (http or https)
          ARBORE_BACKEND_PROTOCOL = ${{ secrets.ARBORE_BACKEND_PROTOCOL }}

          // Backend host (IP:port or domain:port)
          ARBORE_BACKEND_HOST = ${{ secrets.ARBORE_BACKEND_HOST }}
          EOF
          # NE PAS dumper Secrets.xcconfig dans les logs : ARBORE_API_KEY
          # serait imprimée en clair et les Actions logs des repos publics
          # sont consultables par tous (issue #120).
          echo "✅ Secrets.xcconfig created ($(wc -l < Secrets.xcconfig) lines, $(wc -c < Secrets.xcconfig) bytes)"

      - name: 🔑 Setup Keychain for CI
        run: |
          # Create a temporary keychain for CI
          security create-keychain -p "" ci.keychain
          security default-keychain -s ci.keychain
          security unlock-keychain -p "" ci.keychain
          security set-keychain-settings -t 3600 -u ci.keychain
          security list-keychains -d user -s ci.keychain

      - name: 📦 Install CocoaPods dependencies
        run: |
          # Utilise le CDN (source 'https://cdn.cocoapods.org/' dans Podfile)
          # Pas besoin de --repo-update grâce au cache et au CDN
          pod install --verbose
          
      - name: 🧹 Clean build folder
        run: |
          if [ -d ~/Library/Developer/Xcode/DerivedData ]; then
            rm -rf ~/Library/Developer/Xcode/DerivedData
          fi

      - name: 🏗️ Build iOS App for Simulator
        run: |
          set -o pipefail
          xcodebuild clean build \
            -workspace ArboreUi.xcworkspace \
            -scheme ArboreUi \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=18.2' \
            -configuration Debug \
            -derivedDataPath build/ \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            ARBORE_API_KEY="${{ secrets.ARBORE_API_KEY }}" \
            ARBORE_BACKEND_PROTOCOL="${{ secrets.ARBORE_BACKEND_PROTOCOL }}" \
            ARBORE_BACKEND_HOST="${{ secrets.ARBORE_BACKEND_HOST }}" \
            | xcpretty

      - name: 🧪 Switch to test API key (route to arbore_test DB)
        # Si ARBORE_API_KEY_TEST est défini comme secret, on régénère
        # Secrets.xcconfig avec cette clé avant les tests. Le backend
        # détecte la clé test via APIKeyMiddleware et route les écritures
        # vers la DB `arbore_test` au lieu de `arbore` (cf. issue #159 v2).
        # Si le secret n'est pas défini, on reste sur la clé prod et les
        # tests continuent de polluer `arbore` (état antérieur, à éviter).
        if: env.ARBORE_API_KEY_TEST != ''
        env:
          ARBORE_API_KEY_TEST: ${{ secrets.ARBORE_API_KEY_TEST }}
        run: |
          echo "🔁 Réécriture Secrets.xcconfig avec ARBORE_API_KEY_TEST"
          cat > Secrets.xcconfig << EOF
          // Secrets.xcconfig - Test mode (CI only)
          ARBORE_API_KEY = ${ARBORE_API_KEY_TEST}
          ARBORE_BACKEND_PROTOCOL = ${{ secrets.ARBORE_BACKEND_PROTOCOL }}
          ARBORE_BACKEND_HOST = ${{ secrets.ARBORE_BACKEND_HOST }}
          EOF
          echo "✅ Secrets.xcconfig (test) écrit"

      - name: 🧪 Run Unit Tests
        timeout-minutes: 20
        env:
          ARBORE_API_KEY_EFFECTIVE: ${{ secrets.ARBORE_API_KEY_TEST != '' && secrets.ARBORE_API_KEY_TEST || secrets.ARBORE_API_KEY }}
        run: |
          set -o pipefail

          echo "🧪 Running all tests (including integration tests with backend)"
          if [ "${{ secrets.ARBORE_API_KEY_TEST != '' }}" = "true" ]; then
            echo "ℹ️  Mode TEST actif : écritures dans arbore_test DB"
          else
            echo "⚠️  Mode PROD : tests polluent arbore DB (ajouter ARBORE_API_KEY_TEST secret)"
          fi

          xcodebuild test \
            -workspace ArboreUi.xcworkspace \
            -scheme ArboreUi \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=18.2' \
            -derivedDataPath build/ \
            -resultBundlePath build/TestResults.xcresult \
            -parallel-testing-enabled YES \
            -maximum-concurrent-test-simulator-destinations 4 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            ARBORE_API_KEY="$ARBORE_API_KEY_EFFECTIVE" \
            ARBORE_BACKEND_PROTOCOL="${{ secrets.ARBORE_BACKEND_PROTOCOL }}" \
            ARBORE_BACKEND_HOST="${{ secrets.ARBORE_BACKEND_HOST }}" \
            2>&1 | tee build/test-output.log
          
          # Show diagnostic logs
          echo ""
          echo "================================"
          echo "📊 Test execution completed"
          echo "================================"
          if [ -f build/test-output.log ]; then
            echo "Diagnostic logs (last 50 lines):"
            grep -E "🔍|📝|✅|❌|⚠️|Test Suite|Test Case|passed|failed" build/test-output.log | tail -50 || echo "No diagnostic logs found"
          fi

      - name: 📊 Parse test results
        if: always()
        shell: bash {0}
        run: |
          set +e  # Disable exit on error for parsing

          echo "🔍 DEBUG: Current directory: $(pwd)"
          echo "🔍 DEBUG: Listing current directory:"
          ls -la
          echo "🔍 DEBUG: Checking for build directory:"
          ls -la build/ 2>&1 || echo "build/ directory not found"
          echo "🔍 DEBUG: Checking for TestResults.xcresult:"
          ls -la build/TestResults.xcresult 2>&1 || echo "build/TestResults.xcresult not found"

          if [ -d build/TestResults.xcresult ]; then
            echo "✅ TestResults.xcresult exists, parsing..."
            echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Extract test summary using xcresultparser (colored CLI output)
            echo "================================"
            echo "📊 Test Summary (xcresultparser)"
            echo "================================"
            if xcresultparser --output-format cli build/TestResults.xcresult | tee build/test-summary-cli.txt; then
              echo "✅ CLI summary generated successfully"
            else
              echo "⚠️  xcresultparser CLI failed with exit code $?"
            fi

            # Generate text summary for GitHub Actions Summary
            if xcresultparser --output-format txt build/TestResults.xcresult > build/test-summary.txt; then
              echo "✅ TXT summary generated successfully"
            else
              echo "⚠️  xcresultparser TXT failed with exit code $?"
            fi

            # Generate HTML report
            if xcresultparser --output-format html build/TestResults.xcresult > build/test-report.html; then
              echo "✅ HTML report generated successfully"
            else
              echo "⚠️  xcresultparser HTML failed with exit code $?"
            fi

            # Generate JUnit XML for CI integration
            if xcresultparser --output-format junit build/TestResults.xcresult > build/test-results-junit.xml; then
              echo "✅ JUnit XML generated successfully"
            else
              echo "⚠️  xcresultparser JUnit failed with exit code $?"
            fi

            # Display text summary in GitHub Actions Summary
            if [ -f build/test-summary.txt ]; then
              echo '```' >> $GITHUB_STEP_SUMMARY
              cat build/test-summary.txt >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ test-summary.txt not found, skipping GitHub Actions Summary" >> $GITHUB_STEP_SUMMARY
            fi

            # Show diagnostic logs
            echo ""
            echo "================================"
            echo "🔍 Diagnostic Test Logs"
            echo "================================"
            if [ -f build/test-output.log ]; then
              grep -A 10 "FirebaseConfigDiagnosticTests" build/test-output.log || echo "No diagnostic test logs found"
              echo ""
              grep -E "🔍|📝|✅|❌|⚠️" build/test-output.log | tail -100 || echo "No emoji logs found"
            fi
          fi
          set -e  # Re-enable exit on error

      - name: 📤 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-test-results
          path: |
            ArboreUi/build/TestResults.xcresult
            ArboreUi/build/test-report.html
            ArboreUi/build/test-summary.txt
            ArboreUi/build/test-summary-cli.txt
            ArboreUi/build/test-results-junit.xml
            ArboreUi/build/test-output.log
          retention-days: 30

      - name: 📤 Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-build
          path: |
            ArboreUi/build/Build/Products/Debug-iphonesimulator/
          retention-days: 7

      - name: 🧹 Cleanup Keychain
        if: always()
        run: |
          security delete-keychain ci.keychain || true

  # iOS AR Module - Build
  ios_ar:
    needs: changes
    if: needs.changes.outputs.ios_ar == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./ArboreARkit
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🔧 Setup Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: 📱 Show Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: 🧹 Clean build folder
        run: |
          if [ -d ~/Library/Developer/Xcode/DerivedData ]; then
            rm -rf ~/Library/Developer/Xcode/DerivedData
          fi

      - name: 🏗️ Build AR Module for Simulator
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project ArboreARkit.xcodeproj \
            -scheme ArboreARkit \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=18.2' \
            -configuration Debug \
            -derivedDataPath build/ \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty

      - name: 🧪 Run Unit Tests
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -project ArboreARkit.xcodeproj \
            -scheme ArboreARkit \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=18.2' \
            -derivedDataPath build/ \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: 📤 Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ar-build
          path: |
            ArboreARkit/build/Build/Products/Debug-iphonesimulator/
          retention-days: 7

  # Security scanning
  security:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        
      - name: 🔒 Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          
      - name: 📤 Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

  # Job de résumé final
  build_summary:
    needs: [changes, backend, ai_generator, ios_ui, ios_ar]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download iOS test results
        if: needs.ios_ui.result != 'skipped'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ios-ui-test-results
          path: ios-test-results

      - name: 📊 Build Summary
        run: |
          echo "# 🌱 Arbore CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend (Go) | ${{ needs.backend.result || '⏭️ skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| AI Generator (Python) | ${{ needs.ai_generator.result || '⏭️ skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS UI | ${{ needs.ios_ui.result || '⏭️ skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS AR Kit | ${{ needs.ios_ar.result || '⏭️ skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Afficher les résultats des tests iOS si disponibles
          if [ -f ios-test-results/test-summary.txt ]; then
            echo "## 📱 iOS UI Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -20 ios-test-results/test-summary.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📄 [Full test report available in artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # Détails en console
          echo "================================"
          echo "🌱 Arbore CI/CD Summary"
          echo "================================"
          echo "Backend (Go):        ${{ needs.backend.result || 'skipped' }}"
          echo "AI Generator (Py):   ${{ needs.ai_generator.result || 'skipped' }}"
          echo "iOS UI:              ${{ needs.ios_ui.result || 'skipped' }}"
          echo "iOS AR Kit:          ${{ needs.ios_ar.result || 'skipped' }}"
          echo "================================"

          # Afficher les résultats des tests iOS en console
          if [ -f ios-test-results/test-summary.txt ]; then
            echo ""
            echo "================================"
            echo "📱 iOS UI Test Summary"
            echo "================================"
            head -20 ios-test-results/test-summary.txt
            echo "================================"
          fi

          # Échec si un job requis a échoué
          if [[ "${{ needs.backend.result }}" == "failure" ]] || \
             [[ "${{ needs.ai_generator.result }}" == "failure" ]] || \
             [[ "${{ needs.ios_ui.result }}" == "failure" ]] || \
             [[ "${{ needs.ios_ar.result }}" == "failure" ]]; then
            echo "❌ Un ou plusieurs builds ont échoué"
            echo "## ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ Tous les builds ont réussi ou ont été ignorés"
            echo "## ✅ Build Successful" >> $GITHUB_STEP_SUMMARY
          fi