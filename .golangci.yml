# Configuration pour golangci-lint
# https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - unconvert
    - unparam
    - gocyclo
    - gosec
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false

    gocyclo:
      # main() est à 23 (init Mongo prod + test, Firebase, routes, listen).
      # 24 laisse une marge sans excuser un main() qui dériverait davantage.
      min-complexity: 24

    misspell:
      # Mots français présents dans les commentaires et chaînes du backend
      # (la base de code documente en français). Évite les faux positifs
      # type `plantes` → `planets`, `trafic` → `traffic`, `marrage` →
      # `marriage`, `exemple` → `example`.
      ignore-rules:
        - plantes
        - plante
        - trafic
        - exemple
        - marrage
        - candidats
        - intervalles
        - interm
        - incluse

    revive:
      confidence: 0.8

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  
output:
  formats:
    text:
      print-issued-lines: true
      print-linter-name: true
      colors: true
