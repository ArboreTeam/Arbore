name: 🌱 Arbore CI/CD

# Déclenche le workflow sur push ou PR vers main/dev.
# `dev` est la branche d'intégration : les PR de feature la ciblent, donc la CI
# doit y tourner (sinon une feature entre dans dev sans build/test/lint).
on:
  # `push` UNIQUEMENT sur main : un événement `pull_request` teste déjà le
  # commit de MERGE (fusion de la tête dans la base), donc rejouer la CI après
  # le merge dans `dev` retestait exactement le même code.
  #
  # Une modification iOS déclenchait ainsi quatre exécutions macOS pour un seul
  # changement — PR vers dev, push dev, PR de promotion, push main. À ×10 sur le
  # palier Actions, c'était 81 % de la consommation du dépôt.
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:
    inputs:
      clean_pods_cache:
        description: 'Clean CocoaPods cache before build'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Permissions pour les actions GitHub
permissions:
  contents: read
  pull-requests: write
  checks: write
  statuses: write

# Annule les workflows en cours si un nouveau push est fait
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Doit rester aligné sur la directive `go` de ArboreBackend/go.mod. Elle
  # indiquait "1.22" alors que go.mod exigeait 1.25.14 : le mécanisme de
  # toolchain téléchargeait donc silencieusement la bonne version à chaque run,
  # sans cache, et la version réellement utilisée n'était pas celle affichée
  # (audit #338 constat 6). Trois endroits à tenir ensemble : ici, `go.mod` et
  # `ArboreBackend/Dockerfile`.
  GO_VERSION: "1.27.3"
  PYTHON_VERSION: "3.11"
  # Alignée sur web/Dockerfile (node:24-alpine). Tester sur une version autre
  # que celle de l'image publiée, c'est tester autre chose que ce qui tourne.
  NODE_VERSION: "26"
  # latest-stable : chaque runner prend son Xcode le plus récent.
  # ios_ui tourne sur macos-15 → Xcode 26 (SDK iOS 26 requis pour Liquid Glass,
  # ex. .buttonStyle(.glass)). ios_ar reste sur macos-14 → Xcode 16.x.
  XCODE_VERSION: "latest-stable"

jobs:
  # Détection des changements pour optimiser les builds
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ios_ui: ${{ steps.filter.outputs.ios_ui }}
      ios_ar: ${{ steps.filter.outputs.ios_ar }}
      web: ${{ steps.filter.outputs.web }}
      outillage: ${{ steps.filter.outputs.outillage }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'ArboreBackend/**'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
            ios_ui:
              - 'ArboreUi/**'
              - '.github/workflows/ci.yml'
            ios_ar:
              - 'ArboreARkit/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            # Scripts de maintenance et chaîne de vignettes. Les tests qui les
            # couvrent vivent dans `scripts/`, mais ils testent aussi
            # `vignettes/publier.py` — d'où les deux chemins.
            outillage:
              - 'scripts/**'
              - 'vignettes/**'
              - '.github/workflows/ci.yml'

      # Les cinq sorties, en clair, dans le journal de CHAQUE exécution.
      #
      # Ce job décide si `backend`, `ios_ui`, `ios_ar`, `web` et `outillage`
      # tournent. Jusqu'ici, ses décisions ne se lisaient nulle part : il
      # fallait les déduire de quels jobs apparaissaient ensuite — et un job
      # absent est indiscernable d'un job sauté à bon droit.
      #
      # C'est une famille de pannes que ce dépôt a rencontrée trois fois :
      # 58 tests Python que rien n'exécutait (#725), le téléversement Codecov
      # mort derrière un `continue-on-error` (#747), et `cf-update-ranges`
      # qui échouait derrière un repli codé en dur (#652). Chaque fois, la
      # mesure existait et personne ne la voyait.
      #
      # Deux lignes de journal rendent la prochaine dérive lisible d'un coup
      # d'œil, au lieu d'exiger une archéologie de la liste des jobs.
      - name: 🎯 Ce que le filtre a décidé
        run: |
          echo "backend   = ${{ steps.filter.outputs.backend }}"
          echo "ios_ui    = ${{ steps.filter.outputs.ios_ui }}"
          echo "ios_ar    = ${{ steps.filter.outputs.ios_ar }}"
          echo "web       = ${{ steps.filter.outputs.web }}"
          echo "outillage = ${{ steps.filter.outputs.outillage }}"
          {
            echo "### 🎯 Filtre de chemins"
            echo
            echo "| cible | tourne |"
            echo "|---|---|"
            echo "| backend | ${{ steps.filter.outputs.backend }} |"
            echo "| ios_ui | ${{ steps.filter.outputs.ios_ui }} |"
            echo "| ios_ar | ${{ steps.filter.outputs.ios_ar }} |"
            echo "| web | ${{ steps.filter.outputs.web }} |"
            echo "| outillage | ${{ steps.filter.outputs.outillage }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Outillage Python — 58 tests que RIEN n'exécutait jusqu'au 2026-11-03.
  #
  # Ils existaient, ils passaient, et aucun job ne les lançait : `grep -rn
  # pytest .github/workflows/` ne rendait rien (#725). Le symptôme aurait été
  # découvert le jour où l'un d'eux casse, c'est-à-dire jamais.
  #
  # Aucune dépendance à installer : `unittest` est dans la bibliothèque
  # standard, et les trois fichiers chargent leur module par
  # `importlib.util.spec_from_file_location` plutôt que par un paquet. Le job
  # dure quelques secondes, dont l'essentiel en checkout — les tests
  # eux-mêmes prennent 14 millisecondes.
  outillage:
    needs: changes
    if: needs.changes.outputs.outillage == 'true' || github.event_name == 'workflow_dispatch'
    name: 🐍 Outillage (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Alignée sur `vignettes/Dockerfile`, qui exécute `publier.py` en
          # production : tester sur une autre version que celle qui tourne,
          # c'est tester autre chose.
          python-version: "3.11"
      - name: 🧪 Tests unitaires
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  # Backend Go - Tests et Build
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ArboreBackend
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔧 Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ArboreBackend/go.sum

      - name: 📦 Download dependencies
        run: |
          go mod download
          go mod verify

      - name: 🔍 Vet code
        run: go vet ./...

      - name: 🧪 Run tests with coverage
        run: |
          echo "🧪 Running all backend tests (including /models endpoint)..."
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

          echo ""
          echo "📊 Coverage summary:"
          go tool cover -func=coverage.out | grep "total:" || go tool cover -func=coverage.out

          echo ""
          echo "✅ All backend tests passed (including model streaming tests)"

      # Cliquet de couverture : échoue si elle DESCEND, jamais parce qu'elle
      # n'atteint pas un objectif. Le plancher et sa justification vivent dans
      # `.github/couverture-planchers.json`. (#725 point 9)
      - name: 🔒 Cliquet de couverture
        working-directory: .
        run: |
          plancher=$(python3 -c "import json;print(json.load(open('.github/couverture-planchers.json'))['go']['plancher'])")
          mesure=$(cd ArboreBackend && go tool cover -func=coverage.out \
                   | awk '$1=="total:"{sub(/%/,"",$3); print $3}')
          echo "couverture Go : ${mesure}%   plancher : ${plancher}%"
          python3 - "$mesure" "$plancher" <<'PY'
          import sys
          mesure, plancher = float(sys.argv[1]), float(sys.argv[2])
          if mesure < plancher:
              print(f"::error::La couverture Go est tombée à {mesure}%, "
                    f"sous le plancher de {plancher}%. Ajouter un test, ou "
                    f"justifier la baisse en abaissant le plancher dans "
                    f".github/couverture-planchers.json.")
              raise SystemExit(1)
          marge = mesure - plancher
          print(f"marge : +{marge:.2f} point(s)")
          if marge >= 1.0:
              print(f"::notice::La couverture Go dépasse son plancher de "
                    f"{marge:.1f} points. Relever le plancher à {mesure:.1f} "
                    f"fige le terrain gagné.")
          PY

      # Le téléversement vers Codecov a été RETIRÉ ici (#747).
      #
      # Il échouait à chaque exécution depuis toujours, et `continue-on-error`
      # le masquait. Journal du job du 2026-11-04 :
      #
      #   warning -- Branch `dev` is protected but no token was provided
      #   error   -- Commit creating failed: {"message":"Token required -
      #              not valid tokenless upload"}
      #
      # Aucun secret CODECOV_* n'existe, et le dépôt est privé : le
      # téléversement sans jeton est refusé. Le step mesurait donc une
      # couverture que personne ne recevait.
      #
      # Ce qui fait le travail à sa place est le CLIQUET juste au-dessus
      # (#731), et il le fait mieux : il FAIT ÉCHOUER la CI quand la
      # couverture recule, ce que Codecov n'a jamais fait ici.
      #
      # Le remettre demande un jeton ET de corriger `file:` en `files:`,
      # renommé à partir de la v5 — c'est consigné dans #747, pas perdu.

      - name: 🔍 Lint code with golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: ArboreBackend
          version: v2.15.0
          args: --timeout=5m

      # Vulnérabilités connues de la stdlib Go et des modules (audit #338
      # constat 6). BLOQUANT, et volontairement : govulncheck ne signale que les
      # vulnérabilités que le code APPELLE réellement, donc quasi zéro faux
      # positif. Vérifié avant activation : 0 vulnérabilité appelée avec le
      # toolchain épinglé (go 1.26.10, dernier patch de sa branche).
      - name: 🛡️ Check known vulnerabilities (govulncheck)
        run: |
          # Épinglé, et pas @latest : `@latest` a cassé tous les jobs backend
          # le 2026-09-17 sans qu'aucune ligne du projet ne change — l'outil
          # avait simplement publié une v1.8.0 qui exigeait go >= 1.26.0, alors
          # que la CI fixait go 1.25.14 avec GOTOOLCHAIN=local.
          #
          # GO_VERSION étant passée en 1.26.10, v1.8.0 est désormais compatible,
          # et le relèvement annoncé dans ce commentaire est fait. On reste
          # épinglé pour la même raison qu'avant : une version d'outil ne doit
          # pas arriver par surprise.
          #
          # Épingler ne périme pas la détection : la base de vulnérabilités est
          # récupérée à l'exécution, seule la logique d'analyse est figée. C'est
          # d'ailleurs cette base qui a bloqué tout le backend le 2026-10-21 —
          # un lot d'alertes stdlib publié dans la journée, corrigé en 1.26.9
          # et 1.26.10.
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: 🏗️ Build binary (Linux)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o main-linux-amd64 .
          
      - name: 🏗️ Build binary (macOS)
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-w -s" -o main-darwin-arm64 .

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: backend-binaries
          path: |
            ArboreBackend/main-linux-amd64
            ArboreBackend/main-darwin-arm64
          retention-days: 7

  # AI Generator Python - Tests et Build  
  ios_ui:
    needs: changes
    # La promotion `dev` -> `main` porte un code déjà validé par la PR de
    # feature : rejouer les tests macOS n'apporte rien et coûte ×10.
    if: >-
      (needs.changes.outputs.ios_ui == 'true' && (github.base_ref != 'main' || github.head_ref != 'dev'))
      || github.event_name == 'workflow_dispatch'
    # macos-15 pour disposer d'Xcode 26 (SDK iOS 26, Liquid Glass).
    runs-on: macos-15
    # 55 min : marge pour build (~7 min) + Run Unit Tests (jusqu'à 35 min) sous Xcode 26.
    timeout-minutes: 55
    defaults:
      run:
        working-directory: ./ArboreUi
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔧 Setup Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: 📱 Show Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: 💎 Setup Ruby for CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: 📦 Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: |
            ArboreUi/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('ArboreUi/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: 🔧 Install CocoaPods, xcpretty and xcresultparser
        run: |
          sudo gem install cocoapods -v 1.16.2
          sudo gem install xcpretty
          brew install a7ex/formulae/xcresultparser
          pod --version
          xcpretty --version
          xcresultparser --version

      - name: 🗑️ Clean CocoaPods cache (si demandé manuellement)
        if: github.event.inputs.clean_pods_cache == 'true'
        run: |
          echo "🧹 Nettoyage du cache CocoaPods demandé..."
          pod cache clean --all
          rm -rf ~/Library/Caches/CocoaPods
          rm -rf ~/.cocoapods

      - name: 🔑 Setup Secrets Configuration
        run: |
          echo "📝 Creating Secrets.xcconfig..."
          cat > Secrets.xcconfig << EOF
          // Secrets.xcconfig - Generated by CI
          // ⚠️ This file is auto-generated in CI

          // === SECURITY ===
          // API Key for authenticating iOS app with backend
          ARBORE_API_KEY = ${{ secrets.ARBORE_API_KEY }}

          // === BACKEND ===
          // Backend protocol (http or https)
          ARBORE_BACKEND_PROTOCOL = ${{ secrets.ARBORE_BACKEND_PROTOCOL }}

          // Backend host (IP:port or domain:port)
          ARBORE_BACKEND_HOST = ${{ secrets.ARBORE_BACKEND_HOST }}
          EOF
          # NE PAS dumper Secrets.xcconfig dans les logs : ARBORE_API_KEY
          # serait imprimée en clair et les Actions logs des repos publics
          # sont consultables par tous (issue #120).
          echo "✅ Secrets.xcconfig created ($(wc -l < Secrets.xcconfig) lines, $(wc -c < Secrets.xcconfig) bytes)"

      - name: 🔑 Setup Keychain for CI
        run: |
          # Create a temporary keychain for CI
          security create-keychain -p "" ci.keychain
          security default-keychain -s ci.keychain
          security unlock-keychain -p "" ci.keychain
          security set-keychain-settings -t 3600 -u ci.keychain
          security list-keychains -d user -s ci.keychain

      - name: 📦 Install CocoaPods dependencies
        run: |
          # Utilise le CDN (source 'https://cdn.cocoapods.org/' dans Podfile)
          # Pas besoin de --repo-update grâce au cache et au CDN
          pod install --verbose
          
      - name: 🧹 Clean build folder
        run: |
          if [ -d ~/Library/Developer/Xcode/DerivedData ]; then
            rm -rf ~/Library/Developer/Xcode/DerivedData
          fi

      - name: 🏗️ Build iOS App for Simulator
        run: |
          set -o pipefail
          xcodebuild clean build \
            -workspace ArboreUi.xcworkspace \
            -scheme ArboreUi \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -configuration Debug \
            -derivedDataPath build/ \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            ARBORE_API_KEY="${{ secrets.ARBORE_API_KEY }}" \
            ARBORE_BACKEND_PROTOCOL="${{ secrets.ARBORE_BACKEND_PROTOCOL }}" \
            ARBORE_BACKEND_HOST="${{ secrets.ARBORE_BACKEND_HOST }}" \
            | xcpretty

      # Vers quel backend les tests tapent, et pourquoi c'est DEV. (#725)
      #
      # Jusqu'au 2026-11-03 ils visaient la PRODUCTION avec `ARBORE_API_KEY_TEST`,
      # qui y route les écritures vers la base `arbore_test`. Ça fonctionnait,
      # mais ça faisait écrire des tests dans le cluster de production — et
      # surtout la clé de test n'est acceptée QUE par la prod, ce qui rendait
      # inatteignable la route `/internal` de provisionnement (absente de la
      # prod par construction, #696).
      #
      # Priorité à dev dès que ses secrets existent. Sans eux, le comportement
      # d'avant est conservé à l'identique : rien ne casse chez qui n'a pas
      # provisionné.
      - name: 🎯 Choisir le backend des tests
        env:
          DEV_HOST: ${{ secrets.ARBORE_DEV_BACKEND_HOST }}
          DEV_API_KEY: ${{ secrets.ARBORE_DEV_API_KEY }}
          TEST_API_KEY: ${{ secrets.ARBORE_API_KEY_TEST }}
        run: |
          if [ -n "$DEV_HOST" ] && [ -n "$DEV_API_KEY" ]; then
            echo "🎯 Backend des tests : DEV ($DEV_HOST)"
            cat > Secrets.xcconfig << EOF
          // Secrets.xcconfig — tests CI, backend de DÉVELOPPEMENT
          ARBORE_API_KEY = ${DEV_API_KEY}
          ARBORE_BACKEND_PROTOCOL = https
          ARBORE_BACKEND_HOST = ${DEV_HOST}
          EOF
            echo "CIBLE_DES_TESTS=dev" >> "$GITHUB_ENV"
          elif [ -n "$TEST_API_KEY" ]; then
            echo "🎯 Backend des tests : PRODUCTION, base arbore_test"
            echo "   Poser ARBORE_DEV_BACKEND_HOST et ARBORE_DEV_API_KEY pour"
            echo "   basculer sur dev et cesser d'écrire dans le cluster de prod."
            cat > Secrets.xcconfig << EOF
          // Secrets.xcconfig — tests CI, backend de PRODUCTION, base de test
          ARBORE_API_KEY = ${TEST_API_KEY}
          ARBORE_BACKEND_PROTOCOL = ${{ secrets.ARBORE_BACKEND_PROTOCOL }}
          ARBORE_BACKEND_HOST = ${{ secrets.ARBORE_BACKEND_HOST }}
          EOF
            echo "CIBLE_DES_TESTS=prod-base-de-test" >> "$GITHUB_ENV"
          else
            echo "⚠️  Aucun secret de test : les tests viseraient la base de PRODUCTION."
            echo "CIBLE_DES_TESTS=prod" >> "$GITHUB_ENV"
          fi

      - name: 🧪 Run Unit Tests
        # 35 min : sous Xcode 26 le `xcodebuild test` recompile l'app + les
        # cibles de test (dont les UI/integration tests) avant de lancer la
        # suite ; 20 min étaient trop justes et faisaient timeout le step.
        timeout-minutes: 35
        env:
          ARBORE_API_KEY_EFFECTIVE: ${{ secrets.ARBORE_DEV_API_KEY != '' && secrets.ARBORE_DEV_API_KEY || (secrets.ARBORE_API_KEY_TEST != '' && secrets.ARBORE_API_KEY_TEST || secrets.ARBORE_API_KEY) }}
          ARBORE_BACKEND_HOST_EFFECTIF: ${{ secrets.ARBORE_DEV_BACKEND_HOST != '' && secrets.ARBORE_DEV_BACKEND_HOST || secrets.ARBORE_BACKEND_HOST }}
          # Les suites d'intégration ne s'exécutent que contre DEV. Sur la
          # production, la route `/internal` de provisionnement n'existe pas
          # (#696) : les tests « membre » se sauteraient en le disant, et les
          # « invité » écriraient dans le cluster de prod. (#725)
          TEST_RUNNER_ARBORE_RUN_LIVE_INTEGRATION_TESTS: ${{ secrets.ARBORE_DEV_BACKEND_HOST != '' && '1' || '' }}
          TEST_RUNNER_ARBORE_INTERNAL_KEY: ${{ secrets.ARBORE_DEV_INTERNAL_KEY }}
        run: |
          set -o pipefail

          echo "🧪 Running all tests (including integration tests with backend)"
          echo "🎯 Cible : ${CIBLE_DES_TESTS:-inconnue}"
          if [ -n "${TEST_RUNNER_ARBORE_RUN_LIVE_INTEGRATION_TESTS:-}" ]; then
            echo "🔌 Suites d'intégration ARMÉES : un backend injoignable fera ÉCHOUER le job"
            if [ -z "${TEST_RUNNER_ARBORE_INTERNAL_KEY:-}" ]; then
              echo "⏭️  Sans ARBORE_DEV_INTERNAL_KEY, les tests « membre » se sauteront"
            fi
          else
            echo "⏭️  Suites d'intégration non armées — elles se sauteront, visiblement"
          fi

          # Pas de -parallel-testing-enabled ici : ce flag surcharge le
          # réglage par cible du scheme. Sans lui, ArboreUiTests reste
          # parallélisé et ArboreUiUITests ne l'est pas (ArboreUi.xcscheme).
          # Deux clones exécutant simultanément testLaunch et
          # test_launchPerformance saturaient le simulateur et faisaient
          # expirer la capture d'écran — faux rouge (cf. run 33640578003).
          xcodebuild test \
            -workspace ArboreUi.xcworkspace \
            -scheme ArboreUi \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -derivedDataPath build/ \
            -resultBundlePath build/TestResults.xcresult \
            -enableCodeCoverage YES \
            -maximum-concurrent-test-simulator-destinations 4 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            ARBORE_API_KEY="$ARBORE_API_KEY_EFFECTIVE" \
            ARBORE_BACKEND_PROTOCOL="${{ secrets.ARBORE_BACKEND_PROTOCOL }}" \
            ARBORE_BACKEND_HOST="$ARBORE_BACKEND_HOST_EFFECTIF" \
            2>&1 | tee build/test-output.log
          
          # Show diagnostic logs
          echo ""
          echo "================================"
          echo "📊 Test execution completed"
          echo "================================"
          if [ -f build/test-output.log ]; then
            echo "Diagnostic logs (last 50 lines):"
            grep -E "🔍|📝|✅|❌|⚠️|Test Suite|Test Case|passed|failed" build/test-output.log | tail -50 || echo "No diagnostic logs found"
          fi

      # Couverture iOS. Elle n'était mesurée NULLE PART avant le 2026-11-03 :
      # ni le schéma ni la CI ne demandaient `-enableCodeCoverage`, donc
      # 54 000 lignes de Swift n'avaient aucun chiffre. La première mesure, à
      # la main, a donné 6,94 % sur l'application (#725).
      #
      # Non bloquant, et délibérément : un seuil posé sur un chiffre qu'on
      # découvre serait arbitraire. Ce qu'on veut d'abord, c'est le VOIR
      # bouger à chaque PR — la même logique que la garde de cloisonnement
      # de #434, qui relève sans refuser.
      - name: 📈 Couverture iOS
        if: always()
        continue-on-error: true
        run: |
          if [ ! -d build/TestResults.xcresult ]; then
            echo "Pas de bundle de résultats — étape de test non atteinte."
            exit 0
          fi
          echo "### 📈 Couverture iOS" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          xcrun xccov view --report --only-targets build/TestResults.xcresult \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # Les vingt fichiers les moins couverts, triés par nombre de lignes
          # NON couvertes : un fichier de 10 000 lignes à 0 % pèse plus qu'un
          # fichier de 20 lignes à 0 %, et c'est ce classement-là qui dit où
          # écrire le prochain test.
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "<details><summary>Les 20 fichiers qui manquent le plus de couverture</summary>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # awk POSIX : les runners macOS n'ont pas la `match()` à trois
          # arguments de GNU awk, qui échouerait ici en silence. On découpe
          # donc les champs à la main — le rapport a la forme
          # `index  chemin  nb  12.34% (56/789)`.
          xcrun xccov view --report --files-for-target ArboreUi.app build/TestResults.xcresult 2>/dev/null \
            | awk 'NF >= 5 && $5 ~ /^\([0-9]+\/[0-9]+\)$/ {
                     pct = $4; sub(/%$/, "", pct)
                     paire = $5; gsub(/[()]/, "", paire)
                     split(paire, n, "/")
                     manquant = n[2] - n[1]
                     chemin = $2
                     sub(/.*\/ArboreUi\/ArboreUi\//, "", chemin)
                     if (manquant > 0) printf "%7d non couvertes  %6.2f%%  %s\n", manquant, pct, chemin
                   }' \
            | sort -rn | head -20 >> "$GITHUB_STEP_SUMMARY" || echo "(classement indisponible)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "</details>" >> "$GITHUB_STEP_SUMMARY"

      # Cliquet de couverture iOS. Séparé de l'étape d'affichage ci-dessus,
      # qui est `continue-on-error` : un rapport illisible ne doit pas faire
      # échouer la CI, une couverture qui RECULE si. (#725 point 9)
      - name: 🔒 Cliquet de couverture iOS
        if: always()
        run: |
          if [ ! -d build/TestResults.xcresult ]; then
            echo "Pas de bundle de résultats — rien à contrôler."
            exit 0
          fi
          plancher=$(python3 -c "import json;print(json.load(open('$GITHUB_WORKSPACE/.github/couverture-planchers.json'))['ios']['plancher'])")
          mesure=$(xcrun xccov view --report --only-targets build/TestResults.xcresult \
                   | awk '$2=="ArboreUi.app"{sub(/%/,"",$4); print $4}')
          echo "couverture iOS : ${mesure}%   plancher : ${plancher}%"
          python3 - "$mesure" "$plancher" <<'PY'
          import sys
          if not sys.argv[1]:
              print("::warning::Couverture iOS illisible dans le rapport xccov.")
              raise SystemExit(0)
          mesure, plancher = float(sys.argv[1]), float(sys.argv[2])
          if mesure < plancher:
              print(f"::error::La couverture iOS est tombée à {mesure}%, sous "
                    f"le plancher de {plancher}%. Ajouter un test, ou justifier "
                    f"la baisse dans .github/couverture-planchers.json.")
              raise SystemExit(1)
          marge = mesure - plancher
          print(f"marge : +{marge:.2f} point(s)")
          if marge >= 1.0:
              print(f"::notice::La couverture iOS dépasse son plancher de "
                    f"{marge:.1f} points. Relever le plancher à {mesure:.1f} "
                    f"fige le terrain gagné.")
          PY

      - name: 📊 Parse test results
        if: always()
        shell: bash {0}
        run: |
          set +e  # Disable exit on error for parsing

          echo "🔍 DEBUG: Current directory: $(pwd)"
          echo "🔍 DEBUG: Listing current directory:"
          ls -la
          echo "🔍 DEBUG: Checking for build directory:"
          ls -la build/ 2>&1 || echo "build/ directory not found"
          echo "🔍 DEBUG: Checking for TestResults.xcresult:"
          ls -la build/TestResults.xcresult 2>&1 || echo "build/TestResults.xcresult not found"

          if [ -d build/TestResults.xcresult ]; then
            echo "✅ TestResults.xcresult exists, parsing..."
            echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Extract test summary using xcresultparser (colored CLI output)
            echo "================================"
            echo "📊 Test Summary (xcresultparser)"
            echo "================================"
            if xcresultparser --output-format cli build/TestResults.xcresult | tee build/test-summary-cli.txt; then
              echo "✅ CLI summary generated successfully"
            else
              echo "⚠️  xcresultparser CLI failed with exit code $?"
            fi

            # Generate text summary for GitHub Actions Summary
            if xcresultparser --output-format txt build/TestResults.xcresult > build/test-summary.txt; then
              echo "✅ TXT summary generated successfully"
            else
              echo "⚠️  xcresultparser TXT failed with exit code $?"
            fi

            # Generate HTML report
            if xcresultparser --output-format html build/TestResults.xcresult > build/test-report.html; then
              echo "✅ HTML report generated successfully"
            else
              echo "⚠️  xcresultparser HTML failed with exit code $?"
            fi

            # Generate JUnit XML for CI integration
            if xcresultparser --output-format junit build/TestResults.xcresult > build/test-results-junit.xml; then
              echo "✅ JUnit XML generated successfully"
            else
              echo "⚠️  xcresultparser JUnit failed with exit code $?"
            fi

            # Display text summary in GitHub Actions Summary
            if [ -f build/test-summary.txt ]; then
              echo '```' >> $GITHUB_STEP_SUMMARY
              cat build/test-summary.txt >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ test-summary.txt not found, skipping GitHub Actions Summary" >> $GITHUB_STEP_SUMMARY
            fi

            # Show diagnostic logs
            echo ""
            echo "================================"
            echo "🔍 Diagnostic Test Logs"
            echo "================================"
            if [ -f build/test-output.log ]; then
              grep -A 10 "FirebaseConfigDiagnosticTests" build/test-output.log || echo "No diagnostic test logs found"
              echo ""
              grep -E "🔍|📝|✅|❌|⚠️" build/test-output.log | tail -100 || echo "No emoji logs found"
            fi
          fi
          set -e  # Re-enable exit on error

      - name: 📤 Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-ui-test-results
          path: |
            ArboreUi/build/TestResults.xcresult
            ArboreUi/build/test-report.html
            ArboreUi/build/test-summary.txt
            ArboreUi/build/test-summary-cli.txt
            ArboreUi/build/test-results-junit.xml
            ArboreUi/build/test-output.log
          retention-days: 30

      - name: 📤 Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-ui-build
          path: |
            ArboreUi/build/Build/Products/Debug-iphonesimulator/
          retention-days: 7

      - name: 🧹 Cleanup Keychain
        if: always()
        run: |
          security delete-keychain ci.keychain || true

  # iOS AR Module - Build
  ios_ar:
    needs: changes
    # La promotion `dev` -> `main` porte un code déjà validé par la PR de
    # feature : rejouer les tests macOS n'apporte rien et coûte ×10.
    if: >-
      (needs.changes.outputs.ios_ar == 'true' && (github.base_ref != 'main' || github.head_ref != 'dev'))
      || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./ArboreARkit
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔧 Setup Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: 📱 Show Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: 🧹 Clean build folder
        run: |
          if [ -d ~/Library/Developer/Xcode/DerivedData ]; then
            rm -rf ~/Library/Developer/Xcode/DerivedData
          fi

      - name: 🏗️ Build AR Module for Simulator
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project ArboreARkit.xcodeproj \
            -scheme ArboreARkit \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -configuration Debug \
            -derivedDataPath build/ \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty

      - name: 🧪 Run Unit Tests
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -project ArboreARkit.xcodeproj \
            -scheme ArboreARkit \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -derivedDataPath build/ \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: 📤 Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-ar-build
          path: |
            ArboreARkit/build/Build/Products/Debug-iphonesimulator/
          retention-days: 7

  # Security scanning
  # ─────────────────────────────────────────────────────────────────────────
  # Web Next.js — Tests, lint et build
  #
  # Ce job manquait. Le dépôt publiait une image web à chaque push sur main ou
  # dev (deploy.yml), et aucun test n'avait jamais été exécuté par la CI : le
  # `build (web)` qu'on voyait passer est le build de l'IMAGE, qui lance
  # `next build` et rien d'autre. Vitest n'était joué qu'à la main, en local.
  #
  # Le typage est contrôlé à part de `next build`. Les deux ne voient pas la
  # même chose : `next build` type-vérifie avec sa propre réécriture du
  # tsconfig, et un fichier de test hors du graphe de l'application peut passer
  # l'un et casser l'autre — c'est arrivé sur les routes de l'atelier (#610).
  # ─────────────────────────────────────────────────────────────────────────
  web:
    name: 🌱 Web (Next.js)
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔧 Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 📦 Install dependencies
        # `npm ci` et non `npm install` : il installe le lockfile à la lettre et
        # échoue si package.json s'en écarte. `install` le réécrirait, et la CI
        # testerait alors un arbre de dépendances que personne n'a validé.
        run: npm ci

      - name: 🔍 Typecheck
        run: npm run typecheck

      - name: 🧹 Lint
        run: npm run lint

      # Avec couverture, et pas seulement `npm run test`. (#725)
      #
      # Le chiffre n'existait nulle part : le provider n'était même pas
      # installé, donc `test:coverage` échouait. La première mesure a donné
      # **30,8 %** — et non les 91,6 % qu'un rapport sans `coverage.all`
      # affiche, parce que v8 n'y compte que les fichiers que les tests
      # chargent.
      #
      # Non bloquant : aucun seuil n'est posé, on veut d'abord voir bouger.
      - name: 🧪 Tests unitaires et d'intégration
        run: npm run test:coverage

      - name: 📈 Couverture web
        if: always()
        continue-on-error: true
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "Pas de résumé de couverture — étape de test non atteinte."
            exit 0
          fi
          echo "### 📈 Couverture web" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            for (const k of ["statements", "branches", "functions", "lines"]) {
              const v = t[k];
              console.log(`${k.padEnd(12)} ${String(v.pct).padStart(6)}%  ${v.covered}/${v.total}`);
            }
          ' | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 🏗️ Build
        # Sans secret : le build doit aboutir sur un checkout nu, sinon il ne
        # pourrait pas aboutir sur le runner de deploy.yml non plus.
        run: npm run build

  security:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
        
      # Rapport complet vers l'onglet Security : non bloquant par nature, il sert
      # à la visibilité et à l'historique.
      - name: 🔒 Trivy — rapport complet (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: 📤 Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

      # Gate BLOQUANT, en CRITICAL uniquement (audit #338 constat 6). Avant, le
      # seul scan présent était en `continue-on-error: true` : rien ne pouvait
      # jamais faire échouer un build, donc la sécurité était purement indicative.
      #
      # Seuil choisi après mesure sur l'arbre réellement checkouté par la CI :
      # CRITICAL = 0, mais HIGH ≠ 0 (brace-expansion, sharp/libvips dans les
      # package-lock npm). Bloquer en HIGH aurait cassé la CI de toute l'équipe
      # dès ce commit. À resserrer sur HIGH une fois ces dépendances à jour.
      - name: 🚧 Trivy — gate bloquant (CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
          format: 'table'

  # Job de résumé final
  build_summary:
    needs: [changes, backend, ios_ui, ios_ar, web, outillage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download iOS test results
        if: needs.ios_ui.result != 'skipped'
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ios-ui-test-results
          path: ios-test-results

      - name: 📊 Build Summary
        run: |
          echo "# 🌱 Arbore CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend (Go) | ${{ needs.backend.result || '⏭️ skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS UI | ${{ needs.ios_ui.result || '⏭️ skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS AR Kit | ${{ needs.ios_ar.result || '⏭️ skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Outillage (Python) | ${{ needs.outillage.result || '⏭️ skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Afficher les résultats des tests iOS si disponibles
          if [ -f ios-test-results/test-summary.txt ]; then
            echo "## 📱 iOS UI Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -20 ios-test-results/test-summary.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📄 [Full test report available in artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # Détails en console
          echo "================================"
          echo "🌱 Arbore CI/CD Summary"
          echo "================================"
          echo "Backend (Go):        ${{ needs.backend.result || 'skipped' }}"
          echo "iOS UI:              ${{ needs.ios_ui.result || 'skipped' }}"
          echo "iOS AR Kit:          ${{ needs.ios_ar.result || 'skipped' }}"
          echo "Web (Next.js):       ${{ needs.web.result || 'skipped' }}"
          echo "================================"

          # Afficher les résultats des tests iOS en console
          if [ -f ios-test-results/test-summary.txt ]; then
            echo ""
            echo "================================"
            echo "📱 iOS UI Test Summary"
            echo "================================"
            head -20 ios-test-results/test-summary.txt
            echo "================================"
          fi

          # Échec si un job requis a échoué
          if [[ "${{ needs.backend.result }}" == "failure" ]] || \
             [[ "${{ needs.ios_ui.result }}" == "failure" ]] || \
             [[ "${{ needs.ios_ar.result }}" == "failure" ]] || \
             [[ "${{ needs.web.result }}" == "failure" ]]; then
            echo "❌ Un ou plusieurs builds ont échoué"
            echo "## ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ Tous les builds ont réussi ou ont été ignorés"
            echo "## ✅ Build Successful" >> $GITHUB_STEP_SUMMARY
          fi