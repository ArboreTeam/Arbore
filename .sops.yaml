# Configuration SOPS — chiffrement des secrets versionnés (#401 §6 bis).
#
# SOPS chiffre les VALEURS et laisse les CLÉS en clair. L'inventaire des
# secrets est donc versionné et lisible en revue de PR ; les valeurs ne le
# sont pas. C'est cette propriété qui rend tenable le critère de #401 : une
# machine neuve sait QUOI lui fournir, sans que le dépôt révèle les valeurs.
#
# Une clé age par environnement. La clé PRIVÉE ne vit jamais dans le dépôt —
# c'est le seul secret restant à poser à la main sur une machine neuve.
#
# Les destinataires ci-dessous sont des clés PUBLIQUES : les publier est sans
# risque, c'est leur raison d'être.

creation_rules:
  # Clés PUBLIQUES. La clé `prod` a été RENOUVELÉE le 2026-09-07 : la
  # précédente avait été exposée dans une sortie de commande et devait donc
  # être tenue pour compromise. Rotation par `sops updatekeys`, qui rechiffre
  # la clé de données sans jamais écrire les secrets en clair. Les publier est sans risque.
  # Les clés PRIVÉES correspondantes vivent dans ~/.config/sops/age/ et ne
  # doivent jamais entrer dans le dépôt.
  # Le motif couvre l'entrée EN CLAIR (`prod.env`, temporaire et gitignorée)
  # comme la sortie chiffrée (`prod.enc.env`) : SOPS applique la règle au
  # fichier qu'on lui donne à lire, pas à la redirection de sortie.
  - path_regex: ^ops/secrets/prod(\.enc)?\.(env|json|p8|key)$
    age: "age13g4e3n5hn3yexpvxkjr07qflzevr8qyr3try07hrr3gxa45dn40srxr2cq"

  - path_regex: ^ops/secrets/dev(\.enc)?\.(env|json|p8|key)$
    age: "age1kz62ge9c0c4t6waz3wlrwke2mtr70hgff0c5xmdg5pagpm6mpuyqnrdzwt"
