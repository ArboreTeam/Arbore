name: "🔒 CodeQL Security Analysis"

# Réactivé le 2026-05-13 après le passage du dépôt en public — CodeQL
# est gratuit pour les repos publics, plus besoin de GitHub Advanced
# Security. Si le dépôt repasse privé un jour, recommenter les triggers
# `push`, `pull_request` et `schedule` ci-dessous (cf. historique de ce
# fichier pour le contexte).

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  schedule:
    - cron: '30 2 * * 1'  # Tous les lundis à 2h30 UTC
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'macos-14' || 'ubuntu-latest' }}
    timeout-minutes: ${{ matrix.language == 'swift' && 60 || 30 }}
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: python
            build-mode: none
          # Swift est commenté car l'analyse CodeQL sur iOS est complexe
          # Décommentez si vous souhaitez l'activer (nécessite plus de configuration)
          # - language: swift
          #   build-mode: manual

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        queries: security-extended,security-and-quality

    - name: Autobuild
      if: matrix.build-mode == 'autobuild'
      uses: github/codeql-action/autobuild@v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
