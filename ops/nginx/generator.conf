# generator.arbore.app — atelier de génération 3D (#609).
#
# Servi par le MÊME conteneur Next.js que web.arbore.app, sur le même :3000.
# Pas de second service : le pare-feu d'origine n'ouvre 80 et 443 qu'aux plages
# Cloudflare, et ces ports sont déjà couverts — un conteneur de plus, ce serait
# une surface d'attaque de plus, un certificat de plus, et un oubli de plus le
# jour d'un durcissement.
#
# C'est le middleware Next qui sépare les deux hôtes : il exige une session de
# clé pour tout ce qui vient d'ici, et rend /generator introuvable ailleurs.
# Un test vérifie cette protection croisée dans les deux sens.
#
# Le :80 ne sert qu'à rediriger : l'atelier manipule des visuels produit, il
# n'a aucune raison d'être joignable en clair, même derrière Cloudflare.

server {
    listen 80;
    server_name generator.arbore.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name generator.arbore.app;

    # Certificat d'origine Cloudflare. Il doit couvrir ce sous-domaine :
    # un certificat émis pour web.arbore.app seul ferait échouer la poignée de
    # main en mode « Full (strict) ». Réémettre pour *.arbore.app si besoin.
    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # L'atelier n'a aucune raison d'être indexé ni mis en cache.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Les GLB et les planches d'aperçus passent par ici.
    client_max_body_size 128m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Une génération peut tenir le lien ouvert plusieurs minutes.
        proxy_read_timeout 300s;
    }
}
